spring:
  datasource:
    url: ${VENDOR_DATASOURCE_URL:jdbc:mysql://localhost:3306/project}
    username: ${VENDOR_DATASOURCE_USERNAME:root}
    password: ${VENDOR_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
server:
  port: ${VENDOR_SERVER_PORT:8086}
